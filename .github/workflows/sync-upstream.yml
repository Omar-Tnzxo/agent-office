name: Sync upstream

# This fork follows AgentSystemLabs/agent-office (see FORK.md). Every 6 hours, or when run by hand,
# upstream's main is merged into this fork's main; if the merge is clean and the build and tests
# pass, it's pushed and release.yml publishes it (started from here, since a push made with
# GITHUB_TOKEN starts no workflow). A merge that conflicts or fails, or a push GitHub turns down
# (GITHUB_TOKEN may not push upstream's changes to .github/workflows), publishes nothing and opens
# an issue instead.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream's main
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/AgentSystemLabs/agent-office.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Upstream commits to take in:"
          git log --oneline HEAD..upstream/main
          git merge --no-edit -m "Merge upstream main into the fork" upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build and test the merge
        if: steps.merge.outputs.changed == 'true'
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Push, and publish a release
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          gh workflow run release.yml --ref main

      - name: Ask for a hand
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Upstream sync needs a hand'
          body="Merging AgentSystemLabs/agent-office's main into this fork didn't go through, so nothing was published: $RUN_URL. Merge upstream/main into main by hand (a conflict with the fork's changes, failing tests, or a change to .github/workflows that GITHUB_TOKEN may not push), then run Sync upstream again."
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$title" --body "$body"; fi
